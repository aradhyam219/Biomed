[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "biomedical-extractor"
version = "0.1.0"
description = "Biomedical entity and relation extraction with GLiNER, GLiREL, and a controlled LLM path"
requires-python = ">=3.11,<3.13"
dependencies = [
    "gliner==0.2.29",
    "glirel==1.2.1",
    "huggingface-hub>=0.21.4,<1.0",
    "langchain-core>=0.3,<2.0",
    "langchain-openai>=0.3,<2.0",
    "loguru>=0.7,<1.0",
    "protobuf>=4.25,<7.0",
    "transformers==4.51.3",
]

[project.scripts]
biomedical-extract = "biomedical_extractor.cli:main"
biomedical-ner = "biomedical_extractor.ner_cli:main"
biomedical-re = "biomedical_extractor.relation_cli:main"
biomedical-extract-llm = "biomedical_extractor.llm_cli:main"
biored-evaluate = "biomedical_extractor.biored_cli:main"
biomedical-ner-evaluate = "biomedical_extractor.ner_evaluation_cli:main"
biomedical-ner-aioner-evaluate = "biomedical_extractor.aioner_evaluation_cli:main"
biomedical-ner-hunflair2-evaluate = "biomedical_extractor.hunflair2_evaluation_cli:main"
biomedical-ner-compare = "biomedical_extractor.ner_comparison_cli:main"
biomedical-ner-compare-aioner-hunflair2 = "biomedical_extractor.hunflair2_comparison_cli:main"
biomedical-ner-target-domain = "biomedical_extractor.target_domain_cli:main"
biomedical-ner-target-domain-pilot = "biomedical_extractor.target_domain_pilot_cli:main"
biomedical-ner-target-domain-validate = "biomedical_extractor.target_domain_validation_cli:main"
biomedical-ner-hunflair2-train = "biomedical_extractor.hunflair2_training_cli:main"
biomedical-ner-medmentions = "biomedical_extractor.medmentions_cli:main"
biomedical-ner-craft = "biomedical_extractor.craft_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/biomedical_extractor"]
