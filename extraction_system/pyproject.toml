[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "biomedical-extractor"
version = "0.1.0"
description = "Zero-shot biomedical entity and relation extraction with GLiNER and GLiREL"
requires-python = ">=3.11,<3.13"
dependencies = [
    "gliner==0.2.29",
    "glirel==1.2.1",
    "huggingface-hub>=0.21.4,<1.0",
    "loguru>=0.7,<1.0",
    "protobuf>=4.25,<7.0",
    "transformers==4.51.3",
]

[project.scripts]
biomedical-extract = "biomedical_extractor.cli:main"
biored-evaluate = "biomedical_extractor.biored_cli:main"
biored-v1 = "biomedical_extractor.biored_training:main"

[tool.hatch.build.targets.wheel]
packages = ["src/biomedical_extractor"]
