[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "biomedical-extractor"
version = "0.2.0"
description = "Biomedical graph extraction with isolated HunFlair2 and grounded LLM relations"
requires-python = ">=3.11,<3.13"
dependencies = [
    "langchain-core==1.6.3",
    "langchain-openai==1.6.2",
    "openai==3.14.1",
    "pydantic==2.13.5",
    "jsonschema==4.26.0",
]

[project.scripts]
biomedical-ner = "biomedical_extractor.ner_cli:main"
biomedical-re = "biomedical_extractor.relation_cli:main"
biomedical-extract-llm = "biomedical_extractor.llm_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/biomedical_extractor"]

[tool.hatch.build.hooks.custom]
path = "build_hook.py"
